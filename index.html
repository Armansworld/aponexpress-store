<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aponexpress.com — All Your Gadget Needs in One Place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b18;
      --navy: #0a1428;
      --royal: #2563eb;
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.35);
      --green: #10b981;
      --surface: #f8fafc;
      --white: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-soft: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
      --shadow-glow: 0 20px 40px -10px rgba(37, 99, 235, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--surface);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .en {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .top-strip {
      background: linear-gradient(90deg, #050b18 0%, #172554 50%, #050b18 100%);
      color: #e2e8f0;
      font-size: 13.5px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .top-strip-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.25); }
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 45;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 74px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--royal) 0%, #0f172a 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      position: relative;
    }

    .brand-logo::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -3px;
      width: 12px;
      height: 12px;
      background: var(--red);
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
    }

    .brand-tag {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .nav-menu {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-menu a {
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 15.5px;
      transition: color 0.2s;
    }

    .nav-menu a:hover {
      color: var(--royal);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-cta {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      padding: 13px 26px;
      font-size: 16.5px;
      box-shadow: 0 10px 25px var(--red-glow);
    }

    .btn-cta:hover {
      transform: translateY(-2px);
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 13px 24px;
      font-size: 16px;
    }

    .btn-royal {
      background: linear-gradient(135deg, var(--royal) 0%, #1d4ed8 100%);
      color: #fff;
      padding: 11px 20px;
      font-size: 15px;
    }

    .btn-outline {
      background: #fff;
      color: var(--navy);
      border: 1.5px solid var(--border);
      padding: 9px 16px;
      font-size: 14px;
    }

    .btn-danger {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 8px 14px;
      font-size: 13.5px;
    }

    .hero {
      position: relative;
      background:
        radial-gradient(circle at 80% 25%, rgba(37, 99, 235, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 15% 80%, rgba(239, 68, 68, 0.22) 0%, transparent 45%),
        linear-gradient(145deg, #050b18 0%, #0c1a36 55%, #09152b 100%);
      color: #fff;
      padding: 56px 0 72px;
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: center;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(248, 113,

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aponexpress.com — All Your Gadget Needs in One Place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b18;
      --navy: #0a1428;
      --navy-card: #101e3b;
      --royal: #2563eb;
      --cyan: #06b6d4;
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.35);
      --green: #10b981;
      --surface: #f8fafc;
      --white: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius-lg: 24px;
      --radius-md: 16px;
      --shadow-soft: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
      --shadow-glow: 0 20px 40px -10px rgba(37, 99, 235, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--surface);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .en {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .top-strip {
      background: linear-gradient(90deg, #050b18 0%, #172554 50%, #050b18 100%);
      color: #e2e8f0;
      font-size: 13.5px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .top-strip-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.25); }
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 45;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 74px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--royal) 0%, #0f172a 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      position: relative;
    }

    .brand-logo::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -3px;
      width: 12px;
      height: 12px;
      background: var(--red);
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .brand-tag {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .nav-menu {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-menu a {
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 15.5px;
      transition: color 0.2s;
    }

    .nav-menu a:hover {
      color: var(--royal);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-cta {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      padding: 13px 26px;
      font-size: 16.5px;
      box-shadow: 0 10px 25px var(--red-glow);
    }

    .btn-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(239, 68, 68, 0.45);
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 13px 24px;
      font-size: 16px;
      backdrop-filter: blur(8px);
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-royal {
      background: linear-gradient(135deg, var(--royal) 0%, #1d4ed8 100%);
      color: #fff;
      padding: 11px 20px;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .btn-outline {
      background: #fff;
      color: var(--navy);
      border: 1.5px solid var(--border);
      padding: 9px 16px;
      font-size: 14px;
    }

    .btn-outline:hover {
      border-color: var(--royal);
      color: var(--royal);
    }

    .btn-danger {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 8px 14px;
      font-size: 13.5px;
    }

    .hero {
      position: relative;
      background:
        radial-gradient(circle at 80% 25%, rgba(37, 99, 235, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 15% 80%, rgba(239, 68, 68, 0.22) 0%, transparent 45%),
        linear-gradient(145deg, #050b18 0%, #0c1a36 55%, #09152b 100%);
      color: #fff;
      padding: 56px 0 72px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.5;
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: center;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #fecaca;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .hero-title {
      font-size: clamp(32px, 4.6vw, 52px);
      font-weight: 800;
      line-height: 1.16;
      margin-bottom: 14px;
      background: linear-gradient(to right, #ffffff 60%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: 18px;
      color: #cbd5e1;
      margin-bottom: 24px;
      max-width: 580px;
    }

    .hero-price-card {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      border-radius: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .price-current {
      font-size: 36px;
      font-weight: 800;
      color: #34d399;
      line-height: 1;
    }

    .price-strike {
      font-size: 20px;
      color: #94a3b8;
      text-decoration: line-through;
    }

    .discount-tag {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      font-size: 13.5px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .hero-cta-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .hero-trust-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 14px;
      color: #94a3b8;
    }

    .hero-trust-row span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
      font-weight: 600;
    }

    .product-stage {
      position: relative;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
    }

    .stage-frame {
      background: #ffffff;
      border-radius: 20px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 360px;
      position: relative;
      overflow: hidden;
    }

    .stage-frame img {
      width: 100%;
      max-height: 410px;
      object-fit: contain;
      border-radius: 12px;
      transition: transform 0.4s ease;
    }

    .product-stage:hover .stage-frame img {
      transform: scale(1.03);
    }

    .floating-badge-top {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      z-index: 3;
    }

    .stage-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      color: #cbd5e1;
      padding: 0 4px;
    }

    .section {
      padding: 68px 0;
    }

    .section-header {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 42px;
    }

    .section-badge {
      display: inline-block;
      background: #eff6ff;
      color: var(--royal);
      border: 1px solid #bfdbfe;
      font-weight: 700;
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(26px, 3.4vw, 38px);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .section-sub {
      color: var(--text-muted);
      font-size: 16.5px;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .bento-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow-soft);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .bento-card:hover {
      transform: translateY(-5px);
      border-color: #93c5fd;
      box-shadow: var(--shadow-glow);
    }

    .bento-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      color: var(--royal);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .bento-card h3 {
      font-size: 17.5px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 5px;
    }

    .bento-card p {
      font-size: 14.5px;
      color: var(--text-muted);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 26px;
    }

    .prod-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .prod-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.14);
    }

    .prod-media {
      background: #f8fafc;
      height: 270px;
      padding: 18px;
      display: grid;
      place-items: center;
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .prod-media img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    .prod-offer-pill {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--red);
      color: #fff;
      font-size: 12.5px;
      font-
